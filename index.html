<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiveSplit パーツ配置例</title>
  <script type="module" src="./src/entry.ts"></script>
  <!-- Layout belongs to this HTML. Reorder, remove or duplicate parts freely. -->
  <style>
    body { margin: 0; padding: 32px; background: #101318; color: #e8edf3; font-family: "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: auto; display: grid; gap: 24px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    livesplit-timer { text-align: center; --ls-timer-size: clamp(40px, 10vw, 100px); }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 24px; }
    .note { font-size: 12px; opacity: .6; }
  </style>
</head>
<body>
  <main>
    <header><livesplit-game></livesplit-game><livesplit-status></livesplit-status></header>
    <livesplit-timer></livesplit-timer>
    <livesplit-detailed-timer comparison1="Personal Best" comparison2="Best Segments"></livesplit-detailed-timer>
    <livesplit-text left="Custom Variable: counter" right-variable="counter"></livesplit-text>
    <livesplit-splits settings='{"ShowColumnLabels":true,"Columns":[{"Name":"+/-","Type":"Delta","Comparison":"Current Comparison","TimingMethod":"Current Timing Method"},{"Name":"Best +/-","Type":"Segment Delta","Comparison":"Best Segments","TimingMethod":"Current Timing Method"},{"Name":"Best / Delta","Type":"Segment Delta or Segment Time","Comparison":"Best Segments","TimingMethod":"Current Timing Method"},{"Name":"Best Segment","Type":"Comparison Segment Time","Comparison":"Best Segments","TimingMethod":"Current Timing Method"},{"Name":"Time","Type":"Split Time","Comparison":"Current Comparison","TimingMethod":"Current Timing Method"}]}'></livesplit-splits>
    <div class="metrics">
      <livesplit-hotkey-indicator></livesplit-hotkey-indicator>
      <livesplit-segment-timer></livesplit-segment-timer>
      <livesplit-previous-segment settings='{"ShowPossibleTimeSave":true,"Display2Rows":true}'></livesplit-previous-segment>
      <livesplit-previous-segment-time></livesplit-previous-segment-time>
      <livesplit-possible-time-save settings='{"Comparison":"Personal Best","Display2Rows":true}'></livesplit-possible-time-save>
      <livesplit-possible-time-save settings='{"Comparison":"Personal Best","TotalTimeSave":true,"Display2Rows":true}'></livesplit-possible-time-save>
      <livesplit-live-segment></livesplit-live-segment>
      <livesplit-current-pace></livesplit-current-pace>
      <livesplit-sum-of-best></livesplit-sum-of-best>
      <livesplit-real-time></livesplit-real-time>
      <livesplit-game-time></livesplit-game-time>
      <livesplit-best-possible-time></livesplit-best-possible-time>
      <livesplit-delta></livesplit-delta>
      <livesplit-previous-split></livesplit-previous-split>
      <livesplit-comparison-time></livesplit-comparison-time>
      <livesplit-final-time></livesplit-final-time>
      <livesplit-current-split></livesplit-current-split>
      <livesplit-previous-split-name></livesplit-previous-split-name>
      <livesplit-split-progress></livesplit-split-progress>
      <livesplit-attempts></livesplit-attempts>
      <livesplit-completed-attempts></livesplit-completed-attempts>
      <livesplit-phase></livesplit-phase>
      <livesplit-comparison></livesplit-comparison>
      <livesplit-timing-method></livesplit-timing-method>
    </div>
    <livesplit-value class="note" field="split-note"></livesplit-value>
  </main>
</body>
</html>
